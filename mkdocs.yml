site_name: PHP Notebook Documentation
site_description: A Markdown-based documentation website for PHP and CMS learning notes
site_author: Alan
site_url: https://duyduyly.github.io/php-notebook/
repo_name: duyduyly/php-notebook
repo_url: https://github.com/duyduyly/php-notebook
edit_uri: edit/structure/docs/

# Navigation is controlled manually so Documentation Home and Home stay hidden.
# The pages still exist and can be opened by direct links.
nav:
  - CMS: cms/overview.md
  - PHP:
      - Overview: php/overview.md
      - Demo:
          - Demo: php/demo/demo.md
  - Drupal: drupal/overview.md
  - WordPress: wordpress/overview.md
  - Joomla: joomla/overview.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
