site_name: PHP & CMS Documentation
site_description: A Markdown-based documentation website for PHP and CMS learning notes
site_author: Alan
site_url: https://duyduyly.github.io/php-notebook/
repo_name: duyduyly/php-notebook
repo_url: https://github.com/duyduyly/php-notebook
edit_uri: edit/structure/docs/

# The nav section is intentionally omitted.
# MkDocs automatically builds navigation from the docs folder tree.
# New folders and Markdown files appear after the next successful build.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
