<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WordPress API Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="blog-hero py-5 mb-5">
    <div class="container py-4">
      <p class="text-uppercase fw-semibold mb-2">WordPress REST API</p>
      <h1 class="display-5 fw-bold">Latest articles</h1>
      <p class="lead mb-0">Posts rendered in a static HTML website.</p>
    </div>
  </header>

  <main class="container pb-5">
    <div id="alert" class="alert alert-danger d-none" role="alert"></div>
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-3">Loading posts...</p>
    </div>
    <div id="post-list" class="row g-4"></div>
    <nav class="mt-5" aria-label="Blog pagination">
      <ul id="pagination" class="pagination justify-content-center"></ul>
    </nav>
  </main>

  <template id="post-card-template">
    <div class="col-12 col-md-6 col-lg-4">
      <article class="card post-card h-100 border-0 shadow-sm">
        <img class="card-img-top post-card__image" alt="">
        <div class="card-body d-flex flex-column">
          <small class="post-card__date text-secondary mb-2"></small>
          <h2 class="post-card__title h4"></h2>
          <div class="post-card__excerpt text-secondary"></div>
          <a class="post-card__link btn btn-outline-primary mt-auto align-self-start">Read more</a>
        </div>
      </article>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/blog.js"></script>
</body>
</html>
