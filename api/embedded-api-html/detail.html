<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article | WordPress API Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="container py-5">
    <a href="./index.html" class="btn btn-sm btn-outline-secondary mb-4">&larr; Back to blog</a>
    <div id="alert" class="alert alert-danger d-none" role="alert"></div>
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-3">Loading article...</p>
    </div>
    <article id="post" class="post-detail d-none mx-auto">
      <p id="post-date" class="text-secondary mb-2"></p>
      <h1 id="post-title" class="display-5 fw-bold mb-4"></h1>
      <img id="post-image" class="post-detail__image img-fluid rounded-4 mb-4" alt="">
      <div id="post-content" class="post-detail__content"></div>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/detail.js"></script>
</body>
</html>
